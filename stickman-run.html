<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICKMAN RUN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #0d0d0f;
  --surface: #14141a;
  --border:  #2a2a38;
  --text:    #e8e4d8;
  --muted:   #555566;
  --accent:  #c8f04a;
  --danger:  #ff4455;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Mono', monospace;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 200;
}

/* ── START SCREEN ── */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 44px;
}

.title-wrap { text-align: center; }

.title-wrap h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(5rem, 14vw, 10rem);
  letter-spacing: 6px;
  line-height: 0.9;
  color: var(--text);
}

.title-wrap h1 em {
  font-style: normal;
  color: var(--accent);
  text-shadow: 0 0 40px rgba(200,240,74,0.5);
}

.title-wrap .sub {
  font-size: 0.65rem;
  letter-spacing: 6px;
  color: var(--muted);
  margin-top: 10px;
}

.hero-man {
  width: 70px; height: 90px;
  filter: drop-shadow(0 0 14px rgba(200,240,74,0.6));
}

#play-btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 8px;
  color: var(--bg);
  background: var(--accent);
  border: none;
  padding: 16px 72px;
  cursor: pointer;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  outline: none;
}
#play-btn:hover {
  background: #d6ff5e;
  box-shadow: 0 0 50px rgba(200,240,74,0.45);
  transform: translateY(-2px);
}
#play-btn:active { transform: translateY(1px); }

.key-hints {
  font-size: 0.6rem;
  letter-spacing: 3px;
  color: var(--muted);
}

/* ── GAME SCREEN ── */
#game-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 20px;
}

#hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: min(860px, 100%);
  margin-bottom: 12px;
  padding: 0 4px;
}

.hud-label {
  font-size: 0.6rem;
  letter-spacing: 4px;
  color: var(--muted);
  display: block;
  margin-bottom: 2px;
}

#score-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  letter-spacing: 4px;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 20px rgba(200,240,74,0.4);
}

#best-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 4px;
  color: var(--muted);
  line-height: 1;
  text-align: right;
}

.canvas-wrap { position: relative; width: min(860px, 100%); }

#canvas {
  display: block;
  width: 100%;
  height: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 0 0 1px #000, 0 0 80px rgba(200,240,74,0.03), inset 0 0 60px rgba(0,0,0,0.4);
}

#hint {
  margin-top: 12px;
  font-size: 0.58rem;
  letter-spacing: 3px;
  color: var(--muted);
  text-align: center;
}

.speed-flash {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 0.55rem;
  letter-spacing: 3px;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  text-shadow: 0 0 10px var(--accent);
}
.speed-flash.show { opacity: 1; }

/* ── GAME OVER ── */
#game-over-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,13,15,0.9);
  backdrop-filter: blur(6px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 22px;
}

#game-over-overlay h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3.5rem, 10vw, 7rem);
  letter-spacing: 6px;
  color: var(--danger);
  text-shadow: 0 0 50px rgba(255,68,85,0.55);
  animation: goshake 0.35s ease;
}

@keyframes goshake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(7px)}
}

.go-scores {
  display: flex;
  gap: 52px;
  align-items: flex-end;
}

.go-stat { text-align: center; }
.go-stat .lbl {
  font-size: 0.6rem;
  letter-spacing: 4px;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}
.go-stat .val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  letter-spacing: 4px;
  color: var(--text);
  line-height: 1;
}
.go-stat .val.hi { color: var(--accent); text-shadow: 0 0 20px rgba(200,240,74,0.4); }

#restart-btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 6px;
  color: var(--bg);
  background: var(--accent);
  border: none;
  padding: 14px 56px;
  cursor: pointer;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  outline: none;
  margin-top: 6px;
}
#restart-btn:hover { background: #d6ff5e; box-shadow: 0 0 40px rgba(200,240,74,0.4); transform: translateY(-2px); }
#restart-btn:active { transform: translateY(1px); }
</style>
</head>
<body>

<!-- START -->
<div id="start-screen">
  <div class="title-wrap">
    <h1>STICK<em>MAN</em><br>RUN</h1>
    <p class="sub">— INFINITE RUNNER —</p>
  </div>

  <svg class="hero-man" viewBox="0 0 70 90" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#c8f04a" stroke-width="3" stroke-linecap="round" fill="none">
      <circle cx="35" cy="13" r="10"/>
      <line x1="35" y1="23" x2="35" y2="55"/>
      <line id="arm-l" x1="35" y1="32" x2="18" y2="24"/>
      <line id="arm-r" x1="35" y1="32" x2="52" y2="24"/>
      <line id="leg-l" x1="35" y1="55" x2="22" y2="76"/>
      <line id="leg-r" x1="35" y1="55" x2="48" y2="76"/>
    </g>
  </svg>

  <button id="play-btn">&#9654; PLAY</button>
  <p class="key-hints">SPACE &middot; &uarr; &middot; TAP = JUMP &nbsp;|&nbsp; DOUBLE JUMP</p>
</div>

<!-- GAME -->
<div id="game-screen">
  <div id="hud">
    <div>
      <span class="hud-label">SCORE</span>
      <div id="score-display">0</div>
    </div>
    <div style="text-align:right">
      <span class="hud-label">BEST</span>
      <div id="best-display">0</div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas" width="860" height="230"></canvas>
    <div class="speed-flash" id="speed-flash">&#9650; SPEED UP</div>
  </div>
  <p id="hint">SPACE &middot; ARROW UP &middot; TAP TO JUMP &nbsp;|&nbsp; DOUBLE JUMP ALLOWED</p>
</div>

<!-- GAME OVER -->
<div id="game-over-overlay">
  <h2>GAME OVER</h2>
  <div class="go-scores">
    <div class="go-stat">
      <span class="lbl">SCORE</span>
      <span class="val hi" id="final-score">0</span>
    </div>
    <div class="go-stat">
      <span class="lbl">BEST</span>
      <span class="val" id="final-best">0</span>
    </div>
  </div>
  <button id="restart-btn">&#8635; RETRY</button>
</div>

<script>
const startScreen     = document.getElementById('start-screen');
const gameScreen      = document.getElementById('game-screen');
const gameOverOverlay = document.getElementById('game-over-overlay');
const canvas          = document.getElementById('canvas');
const ctx             = canvas.getContext('2d');
const scoreDisplay    = document.getElementById('score-display');
const bestDisplay     = document.getElementById('best-display');
const finalScore      = document.getElementById('final-score');
const finalBest       = document.getElementById('final-best');
const speedFlash      = document.getElementById('speed-flash');

const CW = 860, CH = 230;
function resizeCanvas() {
  const mw = Math.min(CW, window.innerWidth - 40);
  canvas.style.width  = mw + 'px';
  canvas.style.height = (mw * CH / CW) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const GROUND_Y = 185;
const MAN_X    = 110;

const C = {
  accent: '#c8f04a', text: '#e8e4d8', muted: '#444455',
  muted2: '#22222e', danger: '#ff4455', bg: '#14141a',
};

let score = 0, best = 0, speed = 5, frameCount = 0, animId;
let prevSpeedLevel = 0;

const MAN = { y: 0, vy: 0, jumpsLeft: 0, phase: 0, dead: false, deathTimer: 0 };

// ── TIGHT HITBOX ──
// Stickman feet at MAN.y, torso spans MAN.y-52 to MAN.y-10
// We shrink further to just the central torso cylinder
const HB = { ox: 5, ow: 12, oy: -50, oh: 42 };

let obstacles = [], obstTimer = 0, nextObst = 90;
let particles = [];
let clouds = [{x:160,y:35,s:1},{x:420,y:22,s:0.7},{x:680,y:40,s:0.85}];

function jump() {
  if (MAN.dead) return;
  if (MAN.jumpsLeft > 0) { MAN.vy = -14; MAN.jumpsLeft--; }
}

function resetMan() {
  MAN.y = GROUND_Y; MAN.vy = 0; MAN.jumpsLeft = 2;
  MAN.phase = 0; MAN.dead = false; MAN.deathTimer = 0;
}

function spawnObstacle() {
  if (Math.random() < 0.65) {
    const h = 28 + Math.random() * 20;
    obstacles.push({
      type:'cactus', x: CW+10, y: GROUND_Y - h,
      sw:20, sh:h,
      hbOX:6, hbOW:8, hbOY:0, hbOH:h   // only the thin stem counts
    });
  } else {
    const by = GROUND_Y - 72 - Math.random() * 26;
    obstacles.push({
      type:'bird', x: CW+10, y: by,
      sw:38, sh:18, wing:0,
      hbOX:10, hbOW:18, hbOY:5, hbOH:8  // just the body
    });
  }
}

function spawnDeathParticles() {
  for (let i = 0; i < 20; i++) {
    const a = (Math.PI*2*i/20) + Math.random()*0.5;
    const s = 2 + Math.random()*4;
    particles.push({
      x: MAN_X+11, y: MAN.y-26,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      life:1, decay: 0.035+Math.random()*0.025, r:1.5+Math.random()*2
    });
  }
}

function drawStickman() {
  const feet = MAN.y, cx = MAN_X + 11;
  const headR = 9, headCY = feet - 52 + headR;
  const shoulderY = headCY + headR, hipY = shoulderY + 22;

  ctx.save();
  ctx.strokeStyle = MAN.dead ? C.danger : C.accent;
  ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.shadowColor = MAN.dead ? C.danger : C.accent;
  ctx.shadowBlur  = MAN.dead ? 8 : 12;

  if (MAN.dead) {
    ctx.translate(cx, feet - 20);
    ctx.rotate(Math.min(MAN.deathTimer * 0.09, Math.PI / 2));
    ctx.translate(-cx, -(feet - 20));
  }

  // Head
  ctx.beginPath(); ctx.arc(cx, headCY, headR, 0, Math.PI*2); ctx.stroke();
  // Body
  ctx.beginPath(); ctx.moveTo(cx, shoulderY); ctx.lineTo(cx, hipY); ctx.stroke();

  const inAir = MAN.y < GROUND_Y - 1;
  const sw = inAir ? 0.2 : Math.sin(MAN.phase) * 0.75;

  // Arms
  ctx.beginPath(); ctx.moveTo(cx, shoulderY+4);
  ctx.lineTo(cx - 13 + sw*12, shoulderY+16 - Math.abs(sw)*3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, shoulderY+4);
  ctx.lineTo(cx + 13 - sw*12, shoulderY+16 - Math.abs(sw)*3); ctx.stroke();

  // Legs
  if (inAir) {
    ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx-10, hipY+11); ctx.lineTo(cx-5, hipY+22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+10, hipY+11); ctx.lineTo(cx+5, hipY+22); ctx.stroke();
  } else {
    const ls = Math.sin(MAN.phase);
    ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx - 10 - ls*11, feet); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx + 10 + ls*11, feet); ctx.stroke();
  }
  ctx.restore();
}

function drawCactus(obs) {
  const {x,y,sw,sh} = obs;
  const bx = x + sw/2;
  ctx.save();
  ctx.strokeStyle = C.text; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(232,228,216,0.15)'; ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.moveTo(bx, y+sh); ctx.lineTo(bx, y+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, y+sh*0.38); ctx.lineTo(x+2, y+sh*0.38); ctx.lineTo(x+2, y+sh*0.56); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, y+sh*0.54); ctx.lineTo(x+sw-2, y+sh*0.54); ctx.lineTo(x+sw-2, y+sh*0.7); ctx.stroke();
  ctx.restore();
}

function drawBird(obs) {
  const bx = obs.x+obs.sw/2, by = obs.y+obs.sh/2;
  const w = Math.sin(obs.wing)*6;
  ctx.save();
  ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(232,228,216,0.15)'; ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.ellipse(bx, by, 9, 5, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-9,by); ctx.quadraticCurveTo(bx-17,by-7+w,bx-25,by-1+w); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+9,by); ctx.quadraticCurveTo(bx+17,by-7+w,bx+25,by-1+w); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+9,by); ctx.lineTo(bx+15,by+2); ctx.stroke();
  ctx.restore();
}

function drawCloud(c) {
  ctx.save();
  ctx.strokeStyle = C.muted2; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.9;
  const r = 14*c.s;
  ctx.beginPath();
  ctx.arc(c.x, c.y, r, 0, Math.PI*2);
  ctx.arc(c.x+r, c.y-r*0.5, r*1.2, 0, Math.PI*2);
  ctx.arc(c.x+r*2.2, c.y, r*0.9, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawGround() {
  ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(CW, GROUND_Y); ctx.stroke();
  ctx.strokeStyle = C.muted2; ctx.lineWidth = 1;
  const sp = 28, off = (frameCount * speed * 0.5) % sp;
  for (let x = -off; x < CW; x += sp) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x, GROUND_Y+5); ctx.stroke();
  }
}

function collides(obs) {
  const mx1 = MAN_X + HB.ox,    mx2 = mx1 + HB.ow;
  const my1 = MAN.y + HB.oy,    my2 = my1 + HB.oh;
  const ox1 = obs.x + obs.hbOX, ox2 = ox1 + obs.hbOW;
  const oy1 = obs.y + obs.hbOY, oy2 = oy1 + obs.hbOH;
  return mx1 < ox2 && mx2 > ox1 && my1 < oy2 && my2 > oy1;
}

function gameLoop() {
  frameCount++; score++;
  speed = Math.min(5 + score / 480, 15);
  const sl = Math.floor(score / 480);
  if (sl > prevSpeedLevel) {
    prevSpeedLevel = sl;
    speedFlash.classList.add('show');
    setTimeout(() => speedFlash.classList.remove('show'), 900);
  }

  scoreDisplay.textContent = Math.floor(score / 6);

  // clear
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,CW,CH);

  // clouds
  clouds.forEach(c => { c.x -= speed*0.16; if (c.x < -80) c.x = CW+60; drawCloud(c); });

  // ground
  drawGround();

  // physics
  if (!MAN.dead) {
    MAN.vy += 0.76; MAN.y += MAN.vy;
    if (MAN.y >= GROUND_Y) { MAN.y = GROUND_Y; MAN.vy = 0; MAN.jumpsLeft = 2; }
    if (MAN.y >= GROUND_Y) MAN.phase += 0.22;
  } else {
    MAN.deathTimer++;
  }

  // obstacles
  obstTimer++;
  if (obstTimer >= nextObst) {
    spawnObstacle(); obstTimer = 0;
    nextObst = Math.max(40, 55 + Math.floor(Math.random() * 70));
  }

  obstacles.forEach(obs => {
    obs.x -= speed;
    if (obs.type === 'bird') obs.wing += 0.18;
    obs.type === 'cactus' ? drawCactus(obs) : drawBird(obs);
    if (!MAN.dead && collides(obs)) { MAN.dead = true; spawnDeathParticles(); }
  });
  obstacles = obstacles.filter(o => o.x > -60);

  // particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = C.danger; ctx.shadowColor = C.danger; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
  particles = particles.filter(p => p.life > 0);

  // stickman
  drawStickman();

  if (MAN.dead && MAN.deathTimer > 30) {
    const s = Math.floor(score / 6);
    if (s > best) { best = s; bestDisplay.textContent = best; }
    finalScore.textContent = s; finalBest.textContent = best;
    gameOverOverlay.style.display = 'flex';
    return;
  }

  animId = requestAnimationFrame(gameLoop);
}

function startGame() {
  cancelAnimationFrame(animId);
  obstacles = []; particles = [];
  obstTimer = 0; nextObst = 90;
  score = 0; frameCount = 0; speed = 5; prevSpeedLevel = 0;
  resetMan(); scoreDisplay.textContent = '0';
  startScreen.style.display     = 'none';
  gameScreen.style.display      = 'flex';
  gameOverOverlay.style.display = 'none';
  animId = requestAnimationFrame(gameLoop);
}

document.getElementById('play-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});
canvas.addEventListener('click', () => jump());

// preview animation
let pPhase = 0;
const armL = document.getElementById('arm-l');
const armR = document.getElementById('arm-r');
const legL = document.getElementById('leg-l');
const legR = document.getElementById('leg-r');
function animPreview() {
  pPhase += 0.1;
  const s = Math.sin(pPhase) * 13;
  armL.setAttribute('x2', 18-s); armL.setAttribute('y2', 24+Math.abs(s)*0.3);
  armR.setAttribute('x2', 52+s); armR.setAttribute('y2', 24+Math.abs(s)*0.3);
  legL.setAttribute('x2', 22+s); legL.setAttribute('y2', 76);
  legR.setAttribute('x2', 48-s); legR.setAttribute('y2', 76);
  if (startScreen.style.display !== 'none') requestAnimationFrame(animPreview);
}
animPreview();
</script>
</body>
</html>
